[workspace]
channels = ["conda-forge"]
name = "SmartMic"
platforms = ["win-64"]
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"

# ---------------------------------------------------------------------------
# Core: what the library (repo-root MS_*.py, zeiss_paths.py) and its tests
# need. zen_api itself only imports betterproto + grpclib.
# Image analysis does NOT run here: each ia_* repo has its own pixi env and
# MS_image_analysis.run_analysis calls it in a subprocess.
# ---------------------------------------------------------------------------
[dependencies]
python = "3.11.*"
numpy = ">=2"
pywin32 = "*"        # win32api in zeiss_paths.py (ZEN version from the exe)
pytest = "*"
pytest-cov = "*"
python-dateutil = ">=2.8,<3"   # betterproto 2.0.0b7 needs <3; conda-forge would pick 4.x

[pypi-dependencies]
betterproto = "==2.0.0b7"   # pinned by the Zeiss zen_api package
grpclib = "*"
pylibczirw = ">=5.1,<6"     # CZI metadata reading (MS_metadata, MS_image_metrics)

# ---------------------------------------------------------------------------
# Extras used only by the local projects (projects/*) and sandbox scripts.
# ---------------------------------------------------------------------------
[feature.projects.dependencies]
scipy = "*"          # Marc_SM_002, Slide_Search, DF_Exploration
matplotlib = "*"     # DF_Exploration, Marc_SM, sandbox
tifffile = "*"       # Slide_Search
markdown = "*"       # Marc_SM_002 report
lxml = "*"           # Marc_SM (via python-pptx)
reportlab = "*"      # DF_Exploration report
python-pptx = "*"    # Marc_SM make_pptx.py

[feature.projects.pypi-dependencies]
opencv-python = "*"   # Slide_Search make_search_movie.py
aicspylibczi = "*"    # Marc_SM_002 (imports ia_Marc_002/czi_mosaic in-process)
bioio = "*"           # sandbox
bioio-czi = ">=2.4,<3"

[environments]
# `smartmic` keeps its name so every existing `pixi run -e smartmic ...`
# command keeps working. `default` is the bare library + tests.
default = { solve-group = "main" }
smartmic = { features = ["projects"], solve-group = "main" }

[tasks]
# Run the SmartMic proof-of-concept pipeline.
poc = "python projects/smartmic_poc/MS_SmartMic_PoC.py"

# Offline unit tests — no microscope, safe to run anywhere.
test = "pytest tests/unit -q"
# Hardware tests — talk to the live ZEN-API gateway (opt-in; needs the scope).
test-hw = "pytest tests/hardware -q --run-hardware"
# Everything + coverage.
test-all = "pytest -q --run-hardware --cov"
