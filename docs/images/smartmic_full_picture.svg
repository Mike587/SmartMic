<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="180mm" height="97.5mm" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8901F"/>
    </marker>
    <marker id="human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777777"/>
    </marker>
  </defs>

  <rect width="720" height="390" fill="#FFFFFF"/>

  <!-- Human sets up base experiments in ZEN -->
  <path d="M55,148 V22 H600 V33" fill="none" stroke="#777777" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#human)"/>
  <text x="330" y="15" font-size="11" fill="#555555" text-anchor="middle">sets up base experiments (.czexp) in the ZEN GUI</text>

  <!-- ZEN box with ZEN-API as its own part -->
  <rect x="428" y="35" width="277" height="165" rx="8" fill="#E6ECFA" stroke="#2B4DB3" stroke-width="1.6"/>
  <rect x="414" y="90" width="78" height="50" rx="3" fill="#C9D6F5" stroke="#2B4DB3" stroke-width="1.4"/>
  <text x="453" y="119" font-size="10.5" fill="#1B2F73" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">ZEN-API</text>
  <rect x="515" y="52" width="174" height="56" rx="5" fill="#FFFFFF" stroke="#2B4DB3" stroke-width="1.2"/>
  <text x="602" y="85" font-size="15" fill="#1B2F73" text-anchor="middle">ZEISS microscope</text>
  <text x="515" y="150" font-size="20" font-weight="bold" fill="#1B2F73">ZEN</text>
  <text x="515" y="170" font-size="10" fill="#2B4DB3" letter-spacing="1">ZEISS ACQUISITION SOFTWARE</text>

  <!-- SmartMic -->
  <circle cx="354" cy="115" r="60" fill="#E8F5EC" stroke="#3C9A5F" stroke-width="1.8"/>
  <text x="354" y="100" font-size="18" font-weight="bold" fill="#2A7447" text-anchor="middle">SmartMic</text>
  <text x="354" y="119" font-size="10" fill="#333333" text-anchor="middle">simple, safe commands</text>
  <text x="354" y="134" font-size="10" fill="#333333" text-anchor="middle">docs for the agent</text>
  <text x="354" y="149" font-size="10" fill="#333333" text-anchor="middle">experiment editing</text>

  <!-- Logic / Code -->
  <rect x="274" y="270" width="160" height="65" rx="6" fill="#FFF6E5" stroke="#C8901F" stroke-width="1.6"/>
  <text x="354" y="298" font-size="15" fill="#222222" text-anchor="middle">Logic / Code</text>
  <text x="354" y="317" font-size="11" fill="#555555" text-anchor="middle">experiment script</text>

  <!-- Image analysis -->
  <rect x="520" y="270" width="185" height="65" rx="6" fill="#F2EEFB" stroke="#7E64C8" stroke-width="1.6"/>
  <text x="612.5" y="298" font-size="15" fill="#222222" text-anchor="middle">Image analysis</text>
  <text x="612.5" y="317" font-size="11" fill="#555555" text-anchor="middle">custom Python code</text>

  <!-- Acquisition loop -->
  <line x1="612.5" y1="200" x2="612.5" y2="266" stroke="#333333" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="620" y="238" font-size="11" fill="#333333">images</text>
  <line x1="520" y1="302" x2="438" y2="302" stroke="#333333" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="479" y="295" font-size="11" fill="#333333" text-anchor="middle">targets</text>
  <line x1="354" y1="270" x2="354" y2="179" stroke="#333333" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="362" y="228" font-size="11" fill="#333333">commands</text>

  <!-- You -->
  <circle cx="55" cy="163" r="9" fill="none" stroke="#333333" stroke-width="1.8"/>
  <path d="M38,192 Q38,176 55,176 Q72,176 72,192 Z" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="55" y="215" font-size="13" fill="#222222" text-anchor="middle">You</text>
  <text x="55" y="231" font-size="10" fill="#555555" text-anchor="middle">describe,</text>
  <text x="55" y="244" font-size="10" fill="#555555" text-anchor="middle">review, test</text>

  <!-- You <-> agent -->
  <line x1="80" y1="178" x2="146" y2="178" stroke="#777777" stroke-width="1.4" stroke-dasharray="2 3" marker-start="url(#human)" marker-end="url(#human)"/>

  <!-- AI agent: generic chip icon -->
  <g stroke="#C8901F" stroke-width="1.8" stroke-linecap="round" fill="none">
    <rect x="161" y="164" width="28" height="28" rx="4" fill="#FFF6E5"/>
    <line x1="168" y1="158" x2="168" y2="164"/><line x1="175" y1="158" x2="175" y2="164"/><line x1="182" y1="158" x2="182" y2="164"/>
    <line x1="168" y1="192" x2="168" y2="198"/><line x1="175" y1="192" x2="175" y2="198"/><line x1="182" y1="192" x2="182" y2="198"/>
    <line x1="155" y1="171" x2="161" y2="171"/><line x1="155" y1="178" x2="161" y2="178"/><line x1="155" y1="185" x2="161" y2="185"/>
    <line x1="189" y1="171" x2="195" y2="171"/><line x1="189" y1="178" x2="195" y2="178"/><line x1="189" y1="185" x2="195" y2="185"/>
  </g>
  <text x="175" y="182" font-size="11" font-weight="bold" fill="#9A6A0E" text-anchor="middle">AI</text>
  <text x="175" y="215" font-size="13" fill="#9A6A0E" text-anchor="middle">AI agent</text>
  <text x="175" y="231" font-size="10" fill="#555555" text-anchor="middle">writes the code</text>

  <!-- Agent links -->
  <path d="M200,166 L293,135" fill="none" stroke="#C8901F" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#agent)"/>
  <text x="243" y="143" font-size="10" fill="#9A6A0E" text-anchor="middle" transform="rotate(-18 243 143)">reads docs</text>
  <path d="M200,192 L270,290" fill="none" stroke="#C8901F" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#agent)"/>
  <text x="247" y="250" font-size="10" fill="#9A6A0E">writes</text>
  <path d="M175,240 V365 H612.5 V339" fill="none" stroke="#C8901F" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#agent)"/>
  <text x="394" y="380" font-size="10" fill="#9A6A0E" text-anchor="middle">writes</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
