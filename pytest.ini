[pytest]
# Test discovery roots. Unit tests run anywhere; hardware tests are gated (see
# tests/conftest.py: they need --run-hardware and a matching sample carrier).
testpaths = tests

markers =
    hardware: requires the live ZEN-API microscope; skipped unless --run-hardware is given
    local: depends on machine-local ZEN state (e.g. a named experiment in ZEN's library); opt-in
    slow: long-running test (e.g. the end-to-end smoke acquisition)

addopts = -ra
